# ==========================================================
# Builds the Coding Hub installers.
#
# The Coding Hub is its own application, in the coding-hub/
# folder, with its own database and its own installer. This
# workflow is separate from the Grade 8 Hub one so either can
# be released without touching the other.
#
# To get the installers:
#   1. Actions tab -> "Build Coding Hub installers" -> Run workflow
#      (fill in a version to publish a release as well), OR
#      push a tag such as coding-hub-v1.0.0
#   2. Download them from the run's Artifacts, or from Releases.
# ==========================================================
name: Build Coding Hub installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with these installers (e.g. coding-hub-v1.0.0). Leave blank to only build them.'
        required: false
        default: ''
  push:
    tags:
      - 'coding-hub-v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: coding-hub

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer (.exe)
            command: npm run app:build:win
            artifact: coding-hub-windows
            files: |
              coding-hub/dist-app/*.exe
              coding-hub/dist-app/*.exe.blockmap
          - os: macos-latest
            label: macOS installer (.dmg)
            command: npm run app:build:mac
            artifact: coding-hub-macos
            files: |
              coding-hub/dist-app/*.dmg
          - os: ubuntu-latest
            label: Linux installer (.AppImage / .deb)
            command: npm run app:build:linux
            artifact: coding-hub-linux
            files: |
              coding-hub/dist-app/*.AppImage
              coding-hub/dist-app/*.deb

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the app's own packages
        run: npm install --no-audit --no-fund

      - name: Install the packaging tools
        run: npm run app:setup

      - name: Check the version stamps agree
        run: npm run build

      - name: Build the installer
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/coding-hub-v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Coding Hub ${{ inputs.release_tag || github.ref_name }}
          files: installers/**/*
          generate_release_notes: true
          body: |
            ## Coding Hub ${{ inputs.release_tag || github.ref_name }}

            A learning platform for programming: lessons, coding challenges,
            a question bank, progress tracking and private messaging.

            Download the file for your computer, then open it:

            | Computer | File | What to do |
            |----------|------|------------|
            | Windows  | `CodingHub-Setup-*-windows.exe` | Open it and follow the steps. Windows may warn that the publisher is unknown - choose **More info** then **Run anyway**. |
            | macOS    | `CodingHub-*-mac-arm64.dmg` (Apple Silicon) or `-mac-x64.dmg` (Intel) | Open it and drag the app into Applications. First launch: right-click the app and choose **Open**. |
            | Linux    | `CodingHub-*-linux.AppImage` | Right-click it, allow it to run as a program, then open it. |

            Nothing else needs installing - Node.js is built in.

            The first time it opens, sign in as `admin` with the password shown
            in the window, and change it straight away.
