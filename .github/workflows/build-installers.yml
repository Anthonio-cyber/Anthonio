# ==========================================================
# Builds the Grade 8 Hub installers.
#
# Windows installers can only be built on Windows, and macOS
# installers only on macOS, so GitHub builds each one on the
# right kind of machine and attaches them all to a release.
#
# To get the installers:
#   1. Go to the Actions tab and run "Build installers", OR
#      push a version tag:  git tag v1.0.0 && git push --tags
#   2. Download them from the run's Artifacts, or from Releases
#      if you used a tag.
# ==========================================================
name: Build installers

on:
  workflow_dispatch:        # lets you press a button in the Actions tab
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer (.exe)
            command: npm run app:build:win
            artifact: windows-installer
            files: |
              dist-app/*.exe
              dist-app/*.exe.blockmap
          - os: macos-latest
            label: macOS installer (.dmg)
            command: npm run app:build:mac
            artifact: macos-installer
            files: |
              dist-app/*.dmg
          - os: ubuntu-latest
            label: Linux installer (.AppImage / .deb)
            command: npm run app:build:linux
            artifact: linux-installer
            files: |
              dist-app/*.AppImage
              dist-app/*.deb

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the app's own packages
        run: npm ci

      - name: Install the packaging tools
        run: npm run app:setup

      - name: Build the installer
        run: ${{ matrix.command }}
        env:
          # No code-signing certificate, so build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach installers to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
          body: |
            ## Grade 8 Hub ${{ github.ref_name }}

            Download the file for your computer, then open it:

            | Computer | File | What to do |
            |----------|------|------------|
            | Windows  | `Grade 8 Hub Setup *.exe` | Open it and follow the steps. Windows may warn that the publisher is unknown - choose **More info** then **Run anyway**. |
            | macOS    | `Grade 8 Hub-*.dmg`       | Open it and drag the app into Applications. First launch: right-click the app and choose **Open**. |
            | Linux    | `Grade 8 Hub-*.AppImage`  | Right-click it, allow it to run as a program, then open it. |

            Nothing else needs installing - Node.js is built in.
