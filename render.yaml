# ==========================================================
# Free hosting for the Grade 8 Hub on Render.
#
# How to use it:
#   1. Go to https://render.com -> New -> Blueprint
#   2. Pick this repository and click Apply
#   3. Render asks for an admin username and password, then deploys
#
# This file uses the FREE plan on purpose, so Render does not ask
# for a card.
#
# IMPORTANT - what "free" costs you instead:
#   * The server goes to sleep after about 15 minutes with nobody
#     using it. The next person to open it waits ~50 seconds while
#     it wakes up.
#   * There is NO permanent disk on the free plan, so when it sleeps
#     or redeploys, the database is wiped: every account, message,
#     post and club is lost, with no warning.
#
# That is fine for trying it out and showing friends. Before a real
# class relies on it, see "Keeping your data" in the README.
# ==========================================================
services:
  - type: web
    name: grade8-hub
    runtime: node
    plan: free
    region: frankfurt        # change to whichever region is closest to you
    buildCommand: npm ci
    startCommand: npm start  # runs setup first, which creates the first administrator
    healthCheckPath: /api/health

    envVars:
      # better-sqlite3 ships ready-built binaries up to Node 22. On newer
      # Node it tries to compile itself and the build fails, so pin it.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # No permanent disk on the free plan, so this lives beside the app
      # and is reset whenever the server restarts.
      - key: DATABASE_FILE
        value: ./database/grade8hub.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SEED_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true   # Render makes a long random secret for you
      - key: ADMIN_USERNAME
        sync: false           # Render asks you for these when you deploy
      - key: ADMIN_PASSWORD
        sync: false
