<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d17" />
  <meta name="description" content="Grade 8 Hub - the private network for our class." />
  <title>Grade 8 Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />

  <!-- Installing the hub as a real app -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="application-name" content="Grade 8 Hub" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grade 8 Hub" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="msapplication-TileColor" content="#080a13" />
  <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/pages.css" />
  <link rel="stylesheet" href="/styles/games.css" />
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot-screen">
      <div class="boot-logo">G8</div>
      <p>Loading the Grade 8 Hub...</p>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui">
      <h1>JavaScript is switched off</h1>
      <p>The Grade 8 Hub needs JavaScript. Please turn it on in your browser settings and reload the page.</p>
    </div>
  </noscript>
</body>
</html>
