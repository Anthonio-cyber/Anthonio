<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d17" />
  <meta name="description" content="Coding Hub - learn to code with lessons, coding challenges and thousands of practice questions." />
  <title>Coding Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="application-name" content="Coding Hub" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coding Hub" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="msapplication-TileColor" content="#080a13" />
  <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/pages.css" />
  <link rel="stylesheet" href="/styles/learn.css" />
  <link rel="stylesheet" href="/styles/neon.css" />
  <link rel="stylesheet" href="/styles/celebrate.css" />
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot-screen">
      <div class="boot-logo">&lt;/&gt;</div>
      <p>Loading the Coding Hub...</p>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Runs before the app, and always fetched fresh because the version is
       in the URL. See the file for why this exists. -->
  <script src="/js/update-guard.js?v=1.0.0"></script>

  <script type="module" src="/js/app.js"></script>
  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui">
      <h1>JavaScript is switched off</h1>
      <p>The Coding Hub needs JavaScript. Please turn it on in your browser settings and reload the page.</p>
    </div>
  </noscript>
</body>
</html>
